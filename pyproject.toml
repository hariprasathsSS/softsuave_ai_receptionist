[project]
name = "ai-receptionist"
version = "0.1.0"
description = "AI Universal Receptionist — Multi-Tenant SaaS POC"
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "locust>=2.32",
    "ruff>=0.8",
    "mypy>=1.13",
    "alembic>=1.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend/app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
